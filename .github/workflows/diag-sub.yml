name: diag-sub
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          a=$(curl -s -m 20 -w " HTTP%{http_code}" https://keywordtrip.com/api/subscribe | tr -d '\n' | head -c 200)
          b=$(curl -s -m 20 -w " HTTP%{http_code}" https://keywordtrip.com/api/interest | tr -d '\n' | head -c 200)
          echo "::notice::subscribe=$a"
          echo "::notice::interest=$b"
