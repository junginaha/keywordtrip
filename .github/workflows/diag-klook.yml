name: diag-klook
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - run: |
          cat > t.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ userAgent: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", locale: "ko-KR", viewport:{width:390,height:844} });
          for (const q of ["Tokyo","Bangkok","Sa Pa","Japan"]) {
            const u = "https://affiliate.klook.com/redirect?aid=137536&aff_adid=1484668&k_site=" + encodeURIComponent("https://www.klook.com/ko/search/result/?query=" + encodeURIComponent(q));
            try { const r = await p.goto(u, { waitUntil: "domcontentloaded", timeout: 45000 }); await p.waitForTimeout(6000);
              const t = await p.title(); const txt = (await p.evaluate(() => document.body.innerText)).replace(/\s+/g," ").slice(0,160);
              console.log(`::notice::${q} | ${r && r.status()} | ${p.url().slice(0,90)} | ${t} | ${txt}`);
            } catch (e) { console.log(`::notice::${q} | ERR ${e.message.slice(0,120)}`); }
          }
          await b.close();
          JS
          node t.mjs
