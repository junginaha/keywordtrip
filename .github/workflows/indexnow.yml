name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "43 0 * * *"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build changed URL list
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          host="https://keywordtrip.com"
          event=os.environ.get("EVENT_NAME","")
          before=os.environ.get("BEFORE","")
          sha=os.environ.get("SHA","")
          seed = event == "workflow_dispatch" or not before or set(before)=={"0"}
          changed=[]
          if not seed:
              try:
                  changed=subprocess.check_output(["git","diff","--name-only",before,sha],text=True).splitlines()
              except Exception:
                  seed=True
          if any(p in {".github/workflows/indexnow.yml","a9f4c2e71b6d4c1fa2d3e4f5a6b7c8d9.txt"} for p in changed):
              seed=True
          urls=set()
          if seed or "sitemap.xml" in changed:
              try:
                  xml=open("sitemap.xml",encoding="utf-8").read()
                  urls.update(re.findall(r"<loc>(https://keywordtrip\.com/[^<]*)</loc>",xml))
              except Exception:
                  pass
          if not seed:
              for p in changed:
                  if p=="index.html":
                      urls.add(host+"/")
                  elif p.startswith("trips/") and p.endswith(".html"):
                      urls.add(host+"/"+p[:-5])
          urls=sorted(urls)
          with open("indexnow-urls.json","w",encoding="utf-8") as f:
              json.dump(urls,f,ensure_ascii=False)
          print("IndexNow URLs:", len(urls))
          for u in urls: print(u)
          PY

      - name: Verify IndexNow key on production
        env:
          INDEXNOW_KEY: a9f4c2e71b6d4c1fa2d3e4f5a6b7c8d9
        run: |
          KEY_URL="https://keywordtrip.com/$INDEXNOW_KEY.txt"
          READY=false
          for attempt in 1 2 3 4; do
            BODY=$(curl -fsS --max-time 10 "$KEY_URL" 2>/dev/null || true)
            if [ "$BODY" = "$INDEXNOW_KEY" ]; then
              READY=true
              break
            fi
            sleep 10
          done
          echo "INDEXNOW_READY=$READY" >> "$GITHUB_ENV"
          if [ "$READY" != "true" ]; then
            echo "::warning::IndexNow skipped because the verification key is not yet reachable on keywordtrip.com. A scheduled run will retry."
          fi

      - name: Submit to IndexNow
        if: env.INDEXNOW_READY == 'true'
        env:
          INDEXNOW_KEY: a9f4c2e71b6d4c1fa2d3e4f5a6b7c8d9
        run: |
          COUNT=$(python -c 'import json; print(len(json.load(open("indexnow-urls.json"))))')
          if [ "$COUNT" = "0" ]; then
            echo "No changed public URLs to submit."
            exit 0
          fi
          FAIL=0
          python -c 'import json; print("\n".join(json.load(open("indexnow-urls.json"))))' | while IFS= read -r URL; do
            ENCODED=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$URL")
            CODE=$(curl -sS -o indexnow-response.txt -w "%{http_code}" "https://www.bing.com/indexnow?url=$ENCODED&key=$INDEXNOW_KEY")
            echo "IndexNow HTTP $CODE $URL"
            cat indexnow-response.txt || true
            if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::warning::One or more IndexNow submissions were rejected. Scheduled run will retry."
          fi
